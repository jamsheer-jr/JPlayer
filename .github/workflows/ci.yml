name: CI

# Every push and every pull request that touches the build. This job never touches signing keys
# or Telegram credentials, so it is safe to run on contributions from people you do not know.
#
# A change confined to the site, the docs, Markdown, the store listing text under fastlane/ or
# the PKGBUILD cannot break a build, so it does not start one: that covers the release job's own
# "site: the update feed names x.y.z" commit and ordinary doc edits. A push that also touches
# anything else still runs everything, and workflow_dispatch runs it by hand whatever changed.
on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**/*.md"
      - "fastlane/**"
      - "desktop/packaging/aur/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**/*.md"
      - "fastlane/**"
      - "desktop/packaging/aur/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # No credentials on this path. The app compiles fine without them and says so at runtime,
      # which is exactly what a fork or a pull request should get.
      # :core is the shared half (TDLib, settings, downloads, the streaming window) and :ui the
      # shared Compose half that the desktop app builds on too. Their tests run on a plain JVM,
      # the way the desktop runs them. Both are Kotlin Multiplatform libraries on AGP's own
      # plugin, which has no Android host tests here, so jvmTest is the whole of their suites.
      - name: Run core and ui tests
        run: ./gradlew :core:jvmTest :ui:jvmTest

      # Debug only: the promo and release variants run the same test sources. Since AGP 9 only
      # the tested build type (debug) gets a unit test task at all, so this is every app test.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: tmplayer-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            core/build/reports/tests/
            ui/build/reports/tests/
            app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore
